- name: install build-essential for building native ruby gems
  apt: pkg=build-essential
  tags: install_ruby

- name: install cmake for building native ruby gems
  apt: pkg=cmake
  tags: install_ruby

- name: install MySQL libraries for building mysql client gems
  apt: pkg=libmysqlclient-dev
  tags: install_ruby

- name: install SQLite3 libraries for building mysql client gems
  apt: pkg=libsqlite3-dev
  tags: install_ruby

- name: Install rbenv using curl as user {{ ansible_ssh_user }}
  shell: curl -fsSL https://github.com/rbenv/rbenv-installer/raw/HEAD/bin/rbenv-installer | bash
  become_user: {{ ansible_ssh_user }}  
  environment:  
    HOME: "/home/{{ ansible_ssh_user }}"

- name: update ownership of files generated by rbenv
  file: path="/home/{{ ansible_ssh_user }}/.rbenv"
        state=directory
        recurse=yes
        owner={{ ansible_ssh_user }}
        group={{ ansible_ssh_user }}


- name: install ruby with rbenv
  shell: /home/{{ ansible_ssh_user }}/.rbenv/bin/rbenv install 2.4.10
  become_user: {{ ansible_ssh_user }} 
  environment:  
    HOME: "/home/ub{{ ansible_ssh_user }}untu"

- name: set Ruby version to global
  shell: /home/{{ ansible_ssh_user }}/.rbenv/bin/rbenv global 2.4.10
  become_user: {{ ansible_ssh_user }}  
  environment:  
    HOME: "/home/{{ ansible_ssh_user }}"

- name: Add path for rbenv 
  command: echo 'export PATH="/home/{{ ansible_ssh_user }}/.rbenv/bin:$PATH"' >> /home/{{ ansible_ssh_user }}/.bashrc

- name: Add init command for rbenv 
  command: echo 'eval "$(rbenv init -sh)"' >> /home/{{ ansible_ssh_user }}/.bashrc
  
- name: install shared-mime-info
  apt: pkg=shared-mime-info
  tags: install_ruby

- name: install bundler gem
  shell: /home/{{ ansible_ssh_user }}/.rbenv/versions/2.4.10/bin/gem install bundler -v 1.15.0
  become_user: {{ ansible_ssh_user }}  
  environment:  
    HOME: "/home/{{ ansible_ssh_user }}"  


