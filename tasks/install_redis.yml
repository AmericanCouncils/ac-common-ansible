- name: install redis-server {{redis_name|default('default')}}
  apt: pkg=redis-server
  tags:
    - redis

- name: set up redis.conf {{redis_name|default('default')}}
  become: yes  
  template: src=../templates/redis.conf.j2 dest=/etc/redis/{{redis_name|default('default')}}.conf
  tags:
    - redis

- name: Create Runit Directory for {{redis_name|default('default')}}
  become: yes
  file:
    path: /etc/sv/redis-{{redis_name|default('default')}}
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - redis

- name: Create Log Directory for {{redis_name|default('default')}}
  become: yes
  file:
    path: /var/log/redis-{{redis_name|default('default')}}
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - redis

- name: Create Runit Log Directory for {{redis_name|default('default')}}
  become: yes
  file:
    path: /etc/sv/redis-{{redis_name|default('default')}}/log
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - redis


- name: Set up log  service for {{redis_name|default('default')}}
  become: yes
  copy:
    content: |
      #!/bin/sh
      exec svlogd -tt /var/log/redis-{{redis_name|default('default')}}
    dest: /etc/sv/redis-{{redis_name|default('default')}}/log/run
    owner: root
    group: root
    mode: '0755'
  tags:
    - redis

- name: Create Runit Init Script for {{redis_name|default('default')}}
  become: yes
  template:
    src: ../files/redis-init.j2
    dest: /etc/sv/redis-{{redis_name|default('default')}}/run
    owner: root
    group: root
    mode: '0755'
  tags:
    - redis

- name: Remove redis service directory
  become: yes
  file:
    path: /etc/service/redis-{{ redis_name | default('default') }}
    state: absent
  tags:
    - redis
    
- name: Link {{redis_name|default('default')}} service to runit
  become: yes
  file:
    src: /etc/sv/redis-{{redis_name|default('default')}}
    dest: /etc/service/redis-{{redis_name|default('default')}}
    state: link
  tags:
    - redis


