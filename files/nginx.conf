user www-data;
worker_processes auto;
pid /run/nginx.pid;
load_module modules/ngx_http_headers_more_filter_module.so;
error_log syslog:server=unix:/var/run/nginx-log.sock,facility=daemon notice;
events {
  worker_connections 768;
  use epoll;
}
http {
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  access_log syslog:server=unix:/var/run/nginx-log.sock,facility=daemon;
  gzip on;
  gzip_disable "msie6";
  gzip_types text/plain text/css application/json application/x-javascript
      text/xml application/xml application/xml+rss text/javascript;

  log_format combined_with_reqid
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" REQID:"$sent_http_x_requestid"';
  log_format custom_full_url '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" "$http_x_forwarded_for" '
                             '"$scheme://$host$request_uri"';

  log_format proxy_log '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       '"$host$request_uri" -> "$proxy_host$request_uri"';

  access_log /var/log/nginx/proxy_access.log proxy_log;
  include /etc/nginx/conf.d/*.conf;
  include /etc/nginx/sites-enabled/*;
}